# Configuración de la Tarea 2 — RAG Radar (contrataciones abiertas OECE).

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  outputs_dir: "data/outputs"
  index_dir: "data/processed/index"
  eval_dir: "eval"
  logs_dir: "logs"

data_source:
  portal_url: "https://contratacionesabiertas.oece.gob.pe/"
  downloads_url: "https://contratacionesabiertas.oece.gob.pe/descargas"
  api_docs_url: "https://contratacionesabiertas.oece.gob.pe/api"
  # Descargas masivas: GET /api/v1/file/{source}/{type}/{year}/{month} -> zip con JSON
  # (recordPackage: releases release/record del estándar OCDS). Verificado con curl:
  # no requiere autenticación ni token firmado, a diferencia de El Peruano (Tarea 1).
  bulk_file_url_template: "https://contratacionesabiertas.oece.gob.pe/api/v1/file/{source}/{type}/{year}/{month}"
  source_id: "seace_v3"
  file_type: "json"
  # Meses de 2026 a descargar (mínimo 3, formato YYYY-MM).
  months: ["2026-06", "2026-07", "2026-08"]
  api:
    # Endpoint real para "actualizaciones recientes": filtra por startDate/endDate
    # (fecha de convocatoria, YYYY-MM-DD) sobre el releasePackage/recordPackage.
    # Verificado con curl: startDate/endDate SÍ filtran server-side; parámetros como
    # "sort"/"orderBy" NO existen (se probaron y la API los ignora silenciosamente).
    base_url: "https://contratacionesabiertas.oece.gob.pe/api/v1"
    records_endpoint: "/records"
    records_after_endpoint: "/recordsAfter"  # cursor searchAfter, para >10,000 resultados
    max_page_size: 100
    recent_window_days: 7
    throttle_seconds: 1.0
    max_retries: 3
    timeout_seconds: 30
    cache_dir: "data/raw/api_cache"

territorial_normalization:
  # 25 departamentos del Perú (incluye Callao). Se usa para mapear buyer.address -> departamento.
  departments:
    - "Amazonas"
    - "Áncash"
    - "Apurímac"
    - "Arequipa"
    - "Ayacucho"
    - "Cajamarca"
    - "Callao"
    - "Cusco"
    - "Huancavelica"
    - "Huánuco"
    - "Ica"
    - "Junín"
    - "La Libertad"
    - "Lambayeque"
    - "Lima"
    - "Loreto"
    - "Madre de Dios"
    - "Moquegua"
    - "Pasco"
    - "Piura"
    - "Puno"
    - "San Martín"
    - "Tacna"
    - "Tumbes"
    - "Ucayali"
  unmatched_report_file: "data/outputs/unmatched_locations.csv"

embeddings:
  # Reutiliza el modelo local calibrado en Tarea 1.
  provider: "local"
  model_name: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
  dimension: 768

retrieval:
  top_k: 5
  # Recalibrado en Fase 3 con sweep real (ver eval/results/hybrid_threshold_sweep.csv):
  # a esta escala (20,866 procesos, descripciones cortas y repetitivas) el threshold
  # de Tarea 1 (0.60) NO transfiere -- abstenía incorrectamente 1/12 preguntas reales.
  # 0.45 mantiene 0% de abstención incorrecta en las 12 preguntas conocidas.
  similarity_threshold: 0.45
  numeric_filters: ["monto", "fecha", "departamento", "categoria"]  # nunca se embeben, siempre se filtran

llm:
  provider: "openai"
  model_name: "gpt-4o-mini"
  temperature: 0.0
  max_tokens: 800
  system_prompt: >
    Eres un asistente que responde preguntas sobre procesos de contratación pública
    peruana usando exclusivamente los procesos recuperados. Cita siempre el ocid de
    cada proceso que uses. Si los procesos recuperados no contienen la respuesta,
    indícalo explícitamente en vez de inventar. Los filtros de monto/fecha/departamento/
    categoría ya se aplicaron antes de la búsqueda semántica: no los cuestiones.

pricing:
  llm_input_per_1m_usd: 0.15
  llm_output_per_1m_usd: 0.60
  embeddings_local_per_1m_usd: 0.0

risk_indicator:
  min_processes_per_entity: 5  # umbral mínimo para reportar share de monopostor (justificar en README)
  top_n_suppliers: 10

logging:
  acquisition_log_file: "logs/acquisition_log.csv"
  quality_report_file: "data/outputs/data_quality_report.csv"
  costs_log_file: "logs/costs.csv"
